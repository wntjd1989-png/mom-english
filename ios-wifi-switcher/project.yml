# XcodeGen 설정. `xcodegen generate` 를 실행하면 WiFiSwitcher.xcodeproj 가 만들어집니다.
#
# ⚠️ 처음 한 번 꼭 해야 하는 일
#   1. scripts/set-bundle-id.sh 로 번들 ID 를 본인 것으로 바꾸세요.
#      (예: ./scripts/set-bundle-id.sh com.myname.wifiswitcher)
#   2. 아래 DEVELOPMENT_TEAM 에 본인 팀 ID 를 넣거나, Xcode 에서 직접 선택하세요.
#      팀 ID 는 Xcode > Settings > Accounts 에서 확인할 수 있습니다.

name: WiFiSwitcher

options:
  # 모든 타깃이 PRODUCT_BUNDLE_IDENTIFIER 를 직접 지정하므로 bundleIdPrefix 는 쓰지 않습니다.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 비워 두면 Xcode 에서 팀을 직접 골라야 합니다. 팀 ID 를 알면 여기 넣어 두세요.
    DEVELOPMENT_TEAM: ""
    # iPhone 전용. 아이패드도 쓰려면 "1,2" 로 바꾸세요.
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  # ── 앱 본체 ────────────────────────────────────────────────
  WiFiSwitcher:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/App/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: WiFiSwitcher
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wifiswitcher
        INFOPLIST_FILE: Resources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App/WiFiSwitcher.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WiFiControls
        embed: true
        codeSign: true

  # ── 위젯 + 제어 센터 컨트롤 확장 ──────────────────────────
  WiFiControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Controls
      - path: Sources/Shared
      - path: Resources/Controls/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: WiFiControls
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wifiswitcher.controls
        INFOPLIST_FILE: Resources/Controls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Controls/WiFiControls.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

schemes:
  WiFiSwitcher:
    build:
      targets:
        WiFiSwitcher: all
        WiFiControls: all
    run:
      config: Debug
    archive:
      config: Release
