<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>엄마의 영어</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="하루 20분, 그림과 소리로 배우는 영어. 60대 학습자를 위해 만든 단계별 영어 학습 앱.">
<meta name="theme-color" content="#FFFCF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="엄마의 영어">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
/* ============================================================
   엄마의 영어 — 60대 학습자를 위한 접근성 우선 디자인
   - 기본 글자 20px, 버튼 최소 높이 60px
   - 얇은 회색 글씨 금지, 대비 4.5:1 이상
   - 라이트/다크 모두 대응
   ============================================================ */

:root {
  --bg:        #FFFCF5;
  --bg-soft:   #F6F1E6;
  --card:      #FFFFFF;
  --card-2:    #FBF7EE;
  --ink:       #1B2430;
  --ink-2:     #46536A;
  --line:      #DED5C4;
  --line-2:    #C4B79E;

  --brand:     #1E7F4F;
  --brand-ink: #14603B;
  --brand-soft:#DCF3E5;

  --gold:      #E08A00;
  --gold-soft: #FFF0D0;

  --rose:      #C42B4B;
  --rose-soft: #FDE4E9;

  --blue:      #1F6FB2;
  --blue-soft: #DCEDFB;

  --purple:    #6D4AA8;
  --purple-soft:#EDE4FB;

  /* 색 위에 올라가는 글씨색 — 다크 모드에서는 배경색이 밝아지므로 어두운 글씨로 뒤집습니다 */
  --on-brand:  #FFFFFF;
  --on-rose:   #FFFFFF;
  --on-blue:   #FFFFFF;

  /* 연한 배경 위에 올리는 '글씨용' 색 (버튼 배경색보다 진해야 읽힙니다) */
  --gold-text:  #8A5200;
  --brand-text: #14603B;

  --shadow:    0 4px 0 var(--line-2);
  --shadow-lg: 0 10px 30px rgba(27,36,48,.13);

  --r:   18px;
  --r-lg:26px;

  --fs: 20px;           /* 글씨 크기 설정으로 바뀜 */
  --tap: 62px;          /* 최소 터치 영역 */
}

:root[data-size="large"]  { --fs: 23px; --tap: 68px; }
:root[data-size="xlarge"] { --fs: 26px; --tap: 74px; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #14171C;
    --bg-soft:   #1B1F26;
    --card:      #21262F;
    --card-2:    #272D37;
    --ink:       #F2F5F9;
    --ink-2:     #B9C4D4;
    --line:      #39414E;
    --line-2:    #4A5464;
    --brand:     #3FBF7C;
    --brand-ink: #7BDCA8;
    --brand-soft:#1D3A2C;
    --gold:      #F5B23C;
    --gold-soft: #3A2E15;
    --rose:      #FF7A94;
    --rose-soft: #3B1B23;
    --blue:      #63B3ED;
    --blue-soft: #17293A;
    --purple:    #B69AE8;
    --purple-soft:#2A2140;
    --on-brand:  #04240F;
    --on-rose:   #3A0A15;
    --on-blue:   #04202F;
    --gold-text:  #F5B23C;
    --brand-text: #7BDCA8;
    --shadow:    0 4px 0 var(--line-2);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:        #14171C;
  --bg-soft:   #1B1F26;
  --card:      #21262F;
  --card-2:    #272D37;
  --ink:       #F2F5F9;
  --ink-2:     #B9C4D4;
  --line:      #39414E;
  --line-2:    #4A5464;
  --brand:     #3FBF7C;
  --brand-ink: #7BDCA8;
  --brand-soft:#1D3A2C;
  --gold:      #F5B23C;
  --gold-soft: #3A2E15;
  --rose:      #FF7A94;
  --rose-soft: #3B1B23;
  --blue:      #63B3ED;
  --blue-soft: #17293A;
  --purple:    #B69AE8;
  --purple-soft:#2A2140;
  --on-brand:  #04240F;
  --on-rose:   #3A0A15;
  --on-blue:   #04202F;
  --gold-text:  #F5B23C;
  --brand-text: #7BDCA8;
  --shadow:    0 4px 0 var(--line-2);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
               system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--fs);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  word-break: keep-all;      /* 한글이 단어 중간에서 잘리지 않게 */
  overflow-wrap: break-word; /* 대신 긴 영어 단어는 넘치지 않게 */
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; border-radius: 8px; }

/* ---------- 레이아웃 ---------- */
#app { max-width: 720px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }
.screen { display: none; padding-bottom: 120px; }
.screen.on { display: block; animation: fadeUp .28s ease both; }
@keyframes fadeUp { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }

.pad { padding: 0 18px; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  border-bottom: 2px solid var(--line);
  padding: 12px 18px;
  display: flex; align-items: center; gap: 12px;
}
.tb-item {
  display: flex; align-items: center; gap: 6px;
  font-weight: 800; font-size: .92em;
  padding: 6px 12px; border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--card);
}
.tb-item .em { font-size: 1.25em; line-height: 1; }
.tb-item.streak { color: var(--gold-text); background: var(--gold-soft); border-color: var(--gold); }
.tb-item.xp     { color: var(--brand-text); background: var(--brand-soft); border-color: var(--brand); }
.tb-spacer { flex: 1; }

/* 오늘 목표 링 */
.goal-ring { width: 52px; height: 52px; flex: none; position: relative; }
.goal-ring svg { transform: rotate(-90deg); display:block; }
.goal-ring .track { stroke: var(--line); }
.goal-ring .fill  { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.goal-ring .lbl {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: .62em; font-weight: 900; color: var(--brand-text);
}
.goal-ring.done .lbl { font-size: .9em; }

/* ---------- 카드 / 버튼 ---------- */
.card {
  background: var(--card); border: 2px solid var(--line);
  border-radius: var(--r-lg); padding: 20px; margin: 16px 0;
}

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: var(--tap);
  padding: 14px 20px;
  border: none; border-radius: var(--r);
  font-weight: 900; letter-spacing: -.01em;
  background: var(--brand); color: var(--on-brand);
  box-shadow: 0 5px 0 var(--brand-ink);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brand-ink); }
.btn[disabled] { background: var(--line); color: var(--ink-2); box-shadow: 0 5px 0 var(--line-2); cursor: default; }
.btn.ghost {
  background: var(--card); color: var(--ink);
  border: 2px solid var(--line-2); box-shadow: 0 5px 0 var(--line-2);
}
.btn.rose { background: var(--rose); color: var(--on-rose); box-shadow: 0 5px 0 #8E1B34; }
.btn.small { min-height: 52px; padding: 10px 16px; font-size: .92em; }
.row { display: flex; gap: 12px; }

/* ---------- 홈: 학습 지도 ---------- */
.hero {
  margin: 16px 18px; padding: 20px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--brand-soft), var(--gold-soft));
  border: 2px solid var(--line);
  display: flex; align-items: center; gap: 16px;
}
.hero .txt { flex: 1; min-width: 0; }
.hero h2 { margin: 0 0 4px; font-size: 1.15em; }
.hero p  { margin: 0; color: var(--ink-2); font-size: .88em; font-weight: 700; }
.mascot { width: 92px; height: 92px; flex: none; }

.stage-head {
  margin: 26px 18px 10px; padding: 16px 20px;
  border-radius: var(--r);
  background: var(--card-2); border: 2px solid var(--line);
}
.stage-head .lv { font-size: .78em; font-weight: 900; color: var(--brand-text); letter-spacing: .04em; }
.stage-head h3 { margin: 2px 0 0; font-size: 1.08em; }
.stage-head .desc { margin: 4px 0 0; font-size: .82em; color: var(--ink-2); font-weight: 600; }
.stage-head.locked { opacity: .62; }

.unit {
  margin: 14px 18px; padding: 18px;
  background: var(--card); border: 2px solid var(--line);
  border-radius: var(--r-lg);
}
.unit-top { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.unit-ico { width: 56px; height: 56px; flex: none; border-radius: 16px; background: var(--bg-soft);
            display: grid; place-items: center; overflow: hidden; }
.unit-ico svg { width: 44px; height: 44px; }
.unit-title { flex: 1; min-width: 0; }
.unit-title b { display: block; font-size: 1.02em; }
.unit-title span { font-size: .78em; color: var(--ink-2); font-weight: 700; }

.bar { height: 14px; border-radius: 999px; background: var(--bg-soft); border: 2px solid var(--line); overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .5s ease; }

/* 레슨 노드들 */
.nodes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.node {
  width: 70px; height: 70px; flex: none;
  border-radius: 50%; border: none;
  display: grid; place-items: center;
  font-weight: 900; font-size: .82em;
  background: var(--bg-soft); color: var(--ink-2);
  box-shadow: 0 5px 0 var(--line-2);
  position: relative;
  transition: transform .08s, box-shadow .08s;
}
.node:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line-2); }
.node.done   { background: var(--brand); color:var(--on-brand); box-shadow: 0 5px 0 var(--brand-ink); }
.node.next   { background: var(--gold); color:#4A2C00; box-shadow: 0 5px 0 #A15F00; animation: bob 1.8s ease-in-out infinite; }
.node.locked { opacity: .5; box-shadow: 0 5px 0 var(--line-2); }
.node .crown { position: absolute; top: -8px; right: -4px; font-size: 1.1em; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

.node.next::after {
  content: "지금 여기"; position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
  font-size: .52em; font-weight: 900; color: var(--gold-text); white-space: nowrap;
}
/* 라벨이 아랫줄 버튼에 가리지 않게 줄 간격을 벌립니다 */
.nodes.has-next { row-gap: 34px; padding-bottom: 20px; }

/* ---------- 학습 화면 ---------- */
.lesson-bar { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 12px 18px 14px;
              display: flex; align-items: center; gap: 14px; border-bottom: 2px solid var(--line); }
.x-btn { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 2px solid var(--line);
         background: var(--card); font-size: 1.1em; font-weight: 900; display:grid; place-items:center; }
.prog { flex: 1; height: 18px; border-radius: 999px; background: var(--bg-soft); border: 2px solid var(--line); overflow: hidden; }
.prog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #52C98A); transition: width .45s cubic-bezier(.3,1.4,.5,1); }

.q-head { margin: 20px 18px 4px; font-size: 1.12em; font-weight: 900; }
.q-sub  { margin: 0 18px 14px; font-size: .82em; font-weight: 700; color: var(--ink-2); }

/* 그림 무대 */
.stage-pic {
  margin: 8px 18px 14px; border-radius: var(--r-lg);
  background: var(--card-2); border: 2px solid var(--line);
  min-height: 190px; display: grid; place-items: center; padding: 14px;
  overflow: hidden;
}
.stage-pic svg { width: 170px; height: 170px; }
.stage-pic .emo { font-size: 104px; line-height: 1.1; }
.pop-in { animation: popIn .45s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes popIn { from { transform: scale(.5) rotate(-8deg); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
/* 나타났다가 이어서 둥실 떠 있기 */
.pic-anim { animation: popIn .45s cubic-bezier(.2,1.5,.4,1) both, floaty 3.2s ease-in-out .45s infinite; }
.unit-ico .emo { font-size: 34px; line-height: 1; }
.spk .emo, .spk span { display: block; }

/* 말풍선 문장 */
.speak-row { display: flex; align-items: center; gap: 12px; margin: 0 18px 16px; }
.spk {
  width: var(--tap); height: var(--tap); flex: none; border-radius: 50%;
  border: none; background: var(--blue); color: var(--on-blue);
  box-shadow: 0 5px 0 #15507F; display: grid; place-items: center;
}
.spk:active { transform: translateY(4px); box-shadow: 0 1px 0 #15507F; }
.spk svg { width: 30px; height: 30px; }
.spk.slow { background: var(--purple); box-shadow: 0 5px 0 #4A3079; width: 52px; height: 52px; }
.spk.slow svg { width: 24px; height: 24px; }
.spk.playing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.09)} }

.bubble {
  flex: 1; background: var(--card); border: 2px solid var(--line);
  border-radius: var(--r); padding: 14px 16px; font-weight: 800; line-height: 1.45;
}
.bubble .ko { font-size: .8em; color: var(--ink-2); font-weight: 700; margin-top: 4px; }

/* 선택지 */
.choices { display: grid; gap: 12px; margin: 0 18px; }
.choices.grid2 { grid-template-columns: 1fr 1fr; }
.choice {
  border: 2px solid var(--line); background: var(--card);
  border-radius: var(--r); padding: 16px; min-height: var(--tap);
  font-weight: 800; text-align: left;
  box-shadow: 0 5px 0 var(--line-2);
  display: flex; align-items: center; gap: 12px;
  transition: transform .08s, box-shadow .08s, background .15s, border-color .15s;
}
.choice:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line-2); }
.choice.pic { flex-direction: column; text-align: center; gap: 8px; padding: 14px 10px; }
.choice.pic svg { width: 78px; height: 78px; }
.choice.pic .emo { font-size: 60px; line-height: 1; }
.choice .num { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--bg-soft);
               border: 2px solid var(--line); display: grid; place-items: center; font-size: .72em; font-weight: 900; }
.choice.sel   { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 5px 0 var(--blue); }
.choice.right { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 5px 0 var(--brand); }
.choice.wrong { border-color: var(--rose); background: var(--rose-soft); box-shadow: 0 5px 0 var(--rose); animation: shake .4s; }
.choice[disabled] { cursor: default; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)} }

/* 단어 조립 */
.answer-box {
  margin: 0 18px; min-height: 96px; padding: 10px;
  border-radius: var(--r); background: var(--card-2);
  border: 2px dashed var(--line-2);
  display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start;
}
.answer-box.right { border-color: var(--brand); border-style: solid; background: var(--brand-soft); }
.answer-box.wrong { border-color: var(--rose); border-style: solid; background: var(--rose-soft); }
.bank { margin: 16px 18px 0; display: flex; flex-wrap: wrap; gap: 10px; }
.tile {
  border: 2px solid var(--line-2); background: var(--card);
  border-radius: 14px; padding: 10px 16px; min-height: 54px;
  font-weight: 800; box-shadow: 0 4px 0 var(--line-2);
  transition: transform .08s, box-shadow .08s, opacity .15s;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-2); }
.tile.used { opacity: .28; pointer-events: none; box-shadow: none; transform: translateY(3px); }
.tile.placed { animation: popIn .22s ease both; }

/* 짝 맞추기 */
.match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 18px; }
.match-btn {
  border: 2px solid var(--line); background: var(--card); border-radius: var(--r);
  min-height: 66px; padding: 12px; font-weight: 800; box-shadow: 0 4px 0 var(--line-2);
  display: flex; align-items: center; justify-content: center; text-align: center; gap: 8px;
}
.match-btn .emo { font-size: 1.5em; }
.match-btn.sel  { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 4px 0 var(--blue); }
.match-btn.gone { opacity: .2; pointer-events: none; }
.match-btn.bad  { border-color: var(--rose); background: var(--rose-soft); animation: shake .35s; }

/* 입력 */
.typebox {
  margin: 0 18px; width: calc(100% - 36px);
  min-height: var(--tap); padding: 14px 16px;
  font: inherit; font-weight: 800;
  border: 2px solid var(--line-2); border-radius: var(--r);
  background: var(--card); color: var(--ink);
}
.typebox:focus { border-color: var(--blue); }

/* 하단 판정 바 */
.verdict {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  max-width: 720px; margin: 0 auto;
  background: var(--card); border-top: 3px solid var(--line);
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  transform: translateY(110%); transition: transform .3s cubic-bezier(.2,1.2,.4,1);
}
.verdict.on { transform: none; }
.verdict.good { background: var(--brand-soft); border-top-color: var(--brand); }
.verdict.bad  { background: var(--rose-soft);  border-top-color: var(--rose); }
.verdict h4 { margin: 0 0 4px; font-size: 1.05em; display: flex; align-items: center; gap: 10px; }
.verdict.good h4 { color: var(--brand-ink); }
.verdict.bad  h4 { color: var(--rose); }
.verdict .ans { margin: 0 0 12px; font-weight: 800; font-size: .9em; }
.verdict .ans em { font-style: normal; color: var(--ink-2); font-weight: 700; }

.footer-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  max-width: 720px; margin: 0 auto; padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

/* ---------- 완료 화면 ---------- */
.done-wrap { text-align: center; padding: 40px 18px 0; }
.done-wrap h2 { font-size: 1.6em; margin: 18px 0 6px; }
.done-wrap .mascot { width: 150px; height: 150px; margin: 0 auto; }
.stat-row { display: flex; gap: 12px; margin: 26px 0; }
.stat {
  flex: 1; border-radius: var(--r); border: 3px solid var(--gold);
  background: var(--gold-soft); padding: 14px 8px;
}
.stat b { display: block; font-size: 1.5em; color: var(--gold-text); }
.stat span { font-size: .74em; font-weight: 800; color: var(--ink-2); }
.stat.g { border-color: var(--brand); background: var(--brand-soft); }
.stat.g b { color: var(--brand-text); }
.stat.b { border-color: var(--blue); background: var(--blue-soft); }
.stat.b b { color: var(--blue); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i {
  position: absolute; width: 12px; height: 18px; border-radius: 3px;
  animation: fall 2.6s linear forwards;
}
@keyframes fall {
  from { transform: translateY(-14vh) rotate(0deg); opacity: 1 }
  to   { transform: translateY(105vh) rotate(760deg); opacity: 0 }
}

/* ---------- 기록 ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 12px; }
.cal .d {
  aspect-ratio: 1; border-radius: 10px; background: var(--bg-soft);
  border: 2px solid var(--line); display: grid; place-items: center;
  font-size: .58em; font-weight: 900; color: var(--ink-2);
}
.cal .d.on { background: var(--brand); border-color: var(--brand-ink); color: var(--on-brand); }
.cal .d.today { outline: 3px solid var(--gold); outline-offset: 1px; }
.cal-head { display: grid; grid-template-columns: repeat(7,1fr); gap: 7px; margin-top: 14px; }
.cal-head span { text-align: center; font-size: .6em; font-weight: 900; color: var(--ink-2); }

.word-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 2px solid var(--line);
}
.word-item:last-child { border-bottom: none; }
.word-item .emo { font-size: 1.7em; width: 44px; text-align: center; flex: none; }
.word-item .w { flex: 1; min-width: 0; }
.word-item .w b { display: block; }
.word-item .w span { font-size: .78em; color: var(--ink-2); font-weight: 700; }
.pill { font-size: .62em; font-weight: 900; padding: 5px 11px; border-radius: 999px; flex: none; }
.pill.s0 { background: var(--rose-soft); color: var(--rose); }
.pill.s1 { background: var(--gold-soft); color: var(--gold-text); }
.pill.s2 { background: var(--brand-soft); color: var(--brand-text); }

/* ---------- 설정 ---------- */
.seg { display: flex; gap: 8px; margin-top: 10px; }
.seg button {
  flex: 1; min-height: 56px; border-radius: 14px; font-weight: 900;
  border: 2px solid var(--line-2); background: var(--card); box-shadow: 0 4px 0 var(--line-2);
}
.seg button.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand-ink); box-shadow: 0 4px 0 var(--brand-ink); }
/* 목소리 고르기 목록 */
.voice-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 58px; margin-top: 10px;
  padding: 12px 16px; text-align: left;
  border: 2px solid var(--line-2); border-radius: 14px;
  background: var(--card); box-shadow: 0 4px 0 var(--line-2);
  font-weight: 800; font-size: .88em;
}
.voice-row:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-2); }
.voice-row .vn { flex: 1; min-width: 0; }
.voice-row .vp { flex: none; color: var(--blue); font-size: 1.1em; }
.voice-row.on {
  border-color: var(--brand); background: var(--brand-soft);
  box-shadow: 0 4px 0 var(--brand);
}
.voice-row.on .vp::after { content: " 사용 중"; font-size: .7em; color: var(--brand-text); }

.set-row { padding: 16px 0; border-bottom: 2px solid var(--line); }
.set-row:last-child { border-bottom: none; }
.set-row h4 { margin: 0 0 2px; font-size: .98em; }
.set-row p { margin: 0; font-size: .78em; color: var(--ink-2); font-weight: 700; }

/* ---------- 하단 탭 ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  max-width: 720px; margin: 0 auto;
  background: var(--card); border-top: 3px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  border: none; background: none; padding: 10px 4px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: .6em; font-weight: 900; color: var(--ink-2);
}
.tab .em { font-size: 1.9em; line-height: 1; filter: grayscale(1); opacity: .55; transition: .2s; }
.tab.on { color: var(--brand-text); }
.tab.on .em { filter: none; opacity: 1; transform: translateY(-2px); }

/* ---------- 온보딩 ---------- */
.ob { padding: 44px 22px 0; text-align: center; }
.ob .mascot { width: 160px; height: 160px; margin: 0 auto 10px; }
.ob h1 { font-size: 1.55em; margin: 8px 0; }
.ob p { color: var(--ink-2); font-weight: 700; font-size: .88em; margin: 0 0 26px; }

.toast {
  position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px;
  font-weight: 800; font-size: .82em; z-index: 70; opacity: 0; transition: .3s; pointer-events: none;
  max-width: 90vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%); }

.hide { display: none !important; }

/* ---------- 안내 창 ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(20,24,30,.55);
  display: grid; place-items: center; padding: 18px;
  animation: fadeUp .2s ease both;
}
.modal {
  background: var(--card); border: 3px solid var(--line);
  border-radius: var(--r-lg); padding: 22px;
  max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.modal h3 { margin: 0 0 10px; font-size: 1.15em; }
.modal p  { margin: 0 0 12px; font-size: .86em; font-weight: 700; color: var(--ink-2); line-height: 1.6; }
.modal ol { margin: 0 0 14px; padding-left: 1.3em; font-size: .86em; font-weight: 800; line-height: 1.9; }
.modal ol li::marker { color: var(--brand); font-weight: 900; }

/* 소리 안내 배너 */
.notice {
  margin: 0 18px 4px; padding: 14px 16px;
  border-radius: var(--r); border: 2px solid var(--gold);
  background: var(--gold-soft);
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; text-align: left;
}
.notice .em { font-size: 1.7em; flex: none; }
.notice b { display: block; font-size: .9em; }
.notice span { font-size: .74em; font-weight: 700; color: var(--ink-2); }
/* 글씨를 크게 쓰시는 분도 눌리기 쉽도록 버튼은 한 줄을 다 씁니다 */
.notice button {
  flex: 1 0 100%; min-height: 50px;
  border: 2px solid var(--gold); background: var(--card);
  border-radius: 999px; padding: 9px 15px; font-size: .78em; font-weight: 900; color: var(--gold-text);
}

@media (max-width: 380px) {
  .node { width: 62px; height: 62px; }
  .stage-pic svg { width: 140px; height: 140px; }
  .stage-pic .emo { font-size: 86px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>

      h += '<button class="btn" id="btn-continue">▶︎ ' + esc(nx.unit.t) + ' ' + (nx.n + 1) + '단계 시작하기</button>';
    } else {
      h += '<button class="btn" id="btn-review-now">🎉 전 과정 완료! 복습하기</button>';
    }
    var due = G.dueCount();
    if (due >= 5) {
      h += '<div style="height:12px"></div>' +
        '<button class="btn ghost" id="btn-review2">🔁 복습할 것이 ' + due + '개 있어요</button>';
    }
    h += '</div>';

    // 단계별 지도 — 모든 단계가 처음부터 열려 있어 원하는 곳부터 하실 수 있습니다
    G.CURRICULUM.forEach(function (st) {
      h += '<div class="stage-head">' +
        '<div class="lv">' + st.stage + '단계 · ' + esc(st.name) + '</div>' +
        '<h3>' + esc(st.sub) + '</h3>' +
        '<p class="desc">유닛 ' + st.units.length + '개 · 문장 ' + (st.units.length * 12) + '개</p></div>';

      st.units.forEach(function (u) {
        var done = G.unitDone(u.id), total = G.unitTotal();
        var isNext = nx && nx.unit.id === u.id;
        h += '<div class="unit">' +
          '<div class="unit-top"><div class="unit-ico">' + G.picHTML(u.ic) + '</div>' +
          '<div class="unit-title"><b>' + esc(u.t) + '</b>' +
          '<span>' + Math.min(done, total) + ' / ' + total + ' 단계 완료</span></div>' +
          (done >= total ? '<div style="font-size:1.7em">🏆</div>' : '') + '</div>' +
          '<div class="bar"><i style="width:' + Math.round(Math.min(1, done / total) * 100) + '%"></i></div>' +
          '<div class="nodes' + (isNext ? ' has-next' : '') + '">';
        for (var i = 0; i < total; i++) {
          // '지금 여기' 표시는 이어서 하실 곳 딱 한 군데에만
          var cls = i < done ? 'done' : (isNext && i === done ? 'next' : '');
          h += '<button class="node ' + cls + '" data-unit="' + u.id + '" data-n="' + i + '"' +
            ' aria-label="' + esc(u.t) + ' ' + (i + 1) + '단계">' +
            (i < done ? '⭐' : (i + 1)) + '</button>';
        }
        h += '</div>';
        if (isNext) h += '<p class="q-sub" style="margin:16px 0 0">💡 ' + esc(u.tip) + '</p>';
        h += '</div>';
      });
    });

    el('scr-home').innerHTML = h;
  }

  /* ---------------- 복습 탭 ---------------- */

    var due = G.dueCount(), learned = G.learnedCount(), strong = G.strongCount();
    var h = topbar() + '<div class="pad">';
    h += '<div class="card" style="text-align:center">' +
      '<div class="mascot" style="margin:0 auto">' + (due ? G.MASCOT.think : G.MASCOT.sleep) + '</div>' +
      '<h2 style="margin:10px 0 4px">복습</h2>' +
      '<p style="margin:0 0 16px;color:var(--ink-2);font-weight:700;font-size:.86em">' +
      (due ? '오늘 다시 볼 것이 <b>' + due + '개</b> 있어요.<br>잊어버리기 전에 한 번 더 보면 오래 남아요.'
        : learned ? '지금은 복습할 것이 없어요.<br>새 단계를 배우면 여기에 쌓입니다.'
          : '아직 배운 것이 없어요.<br>먼저 <b>배우기</b>에서 1단계를 시작해 보세요.') + '</p>' +
      (due >= 4 ? '<button class="btn" id="btn-review3">🔁 복습 시작하기</button>'
        : '<button class="btn ghost" id="btn-goto-learn">배우러 가기</button>') + '</div>';

    h += '<div class="stat-row">' +
      '<div class="stat b"><b>' + learned + '</b><span>배운 항목</span></div>' +
      '<div class="stat g"><b>' + strong + '</b><span>확실히 외운 것</span></div>' +
      '<div class="stat"><b>' + due + '</b><span>오늘 복습</span></div></div>';

    var weak = G.weakItems(15);
    if (weak.length) {
      h += '<div class="card"><h3 style="margin:0 0 6px">자주 틀리는 것</h3>' +
        '<p class="q-sub" style="margin:0 0 8px;padding:0">눌러서 소리를 들어 보세요</p>';
      weak.forEach(function (x) {
        var st = x.r.s >= 4 ? 2 : (x.r.s >= 2 ? 1 : 0);
        var lbl = ['더 봐야 해요', '조금 더', '잘 외웠어요'][st];
        h += '<div class="word-item" data-speak="' + esc(x.item.en) + '" role="button" tabindex="0">' +
          '<div class="emo">' + (G.pic(x.item.pic) && G.pic(x.item.pic).type === 'emo' ? G.pic(x.item.pic).html : '🔊') + '</div>' +
          '<div class="w"><b>' + esc(x.item.en) + '</b><span>' + esc(x.item.ko) + '</span></div>' +
          '<div class="pill s' + st + '">' + lbl + '</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    el('scr-review').innerHTML = h;
  }

  /* ---------------- 기록 ---------------- */
  function renderStats() {
    P = G.P();
    var h = topbar() + '<div class="pad">';
    var d = G.today();
    h += '<div class="card"><h3 style="margin:0 0 2px">오늘</h3>' +
      '<div class="stat-row" style="margin:14px 0 0">' +
      '<div class="stat g"><b>' + Math.round(d.min) + '분</b><span>공부 시간</span></div>' +
      '<div class="stat b"><b>' + d.lessons + '</b><span>끝낸 단계</span></div>' +
      '<div class="stat"><b>' + d.xp + '</b><span>오늘 별점</span></div></div>' +
      '<div class="bar" style="margin-top:14px"><i style="width:' + Math.round(G.goalPct() * 100) + '%"></i></div>' +
      '<p class="q-sub" style="padding:0;margin:8px 0 0">하루 목표 ' + P.settings.goal + '분 중 ' + Math.round(d.min) + '분</p></div>';

    // 최근 28일 달력
    h += '<div class="card"><h3 style="margin:0">지난 4주</h3>' +
      '<div class="cal-head"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>' +
      '<div class="cal">';
    var now = new Date(), tk = G.todayKey();
    var start = new Date(now);
    start.setDate(now.getDate() - now.getDay() - 21);    // 이번 주 일요일에서 3주 전
    for (var i = 0; i < 28; i++) {                       // 이번 주가 항상 마지막 줄
      var dd = new Date(start); dd.setDate(start.getDate() + i);
      if (dd > now) { h += '<div class="d" style="opacity:.25"></div>'; continue; }
      var k = G.todayKey(dd), rec = P.days[k];
      h += '<div class="d' + (rec && rec.lessons ? ' on' : '') + (k === tk ? ' today' : '') + '">' + dd.getDate() + '</div>';
    }
    h += '</div></div>';

    h += '<div class="stat-row">' +
      '<div class="stat"><b>🔥' + G.liveStreak() + '</b><span>연속 학습일</span></div>' +
      '<div class="stat g"><b>' + P.bestStreak + '</b><span>최고 기록</span></div>' +
      '<div class="stat b"><b>' + P.xp + '</b><span>전체 별점</span></div></div>';

    h += '<div class="card"><h3 style="margin:0 0 10px">전체 진도</h3>' +
      '<div class="bar"><i style="width:' + Math.round(G.overallPct() * 100) + '%"></i></div>' +
      '<p class="q-sub" style="padding:0;margin:8px 0 14px">' + Math.round(G.overallPct() * 100) + '% 완료 · 총 ' +
      (G.UNITS.length * G.LESSONS_PER_UNIT) + '단계</p>';
    G.CURRICULUM.forEach(function (st) {
      var us = st.units, done = 0;
      us.forEach(function (u) { done += Math.min(G.LESSONS_PER_UNIT, G.unitDone(u.id)); });
      var p = Math.round(done / (us.length * G.LESSONS_PER_UNIT) * 100);
      h += '<div class="word-item"><div class="emo">' + (p === 100 ? '🏆' : p > 0 ? '📖' : '🔒') + '</div>' +
        '<div class="w"><b>' + st.stage + '단계 · ' + esc(st.name) + '</b>' +
        '<span>' + esc(st.sub) + '</span></div><div class="pill s' + (p === 100 ? 2 : p > 0 ? 1 : 0) + '">' + p + '%</div></div>';
    });
    h += '</div></div>';
    el('scr-stats').innerHTML = h;
  }

    h += '<div class="set-row"><h4>정답 효과음</h4><p>맞히면 밝은 소리와 함께 "정답입니다" 하고 알려드려요</p>' +
      '<div class="seg" id="seg-sfx">' +
      [['1', '켜기'], ['0', '끄기']].map(function (o) {
        return '<button data-v="' + o[0] + '" class="' + ((P.settings.sfx ? '1' : '0') === o[0] ? 'on' : '') + '">' + o[1] + '</button>';

      [['10', '10분'], ['20', '20분'], ['30', '30분']].map(function (o) {

      }).join('') + '</div></div>';

    h += '<div class="set-row"><h4>화면 밝기</h4><p>어두운 곳에서는 어둡게가 편해요</p><div class="seg" id="seg-theme">' +
      [['auto', '자동'], ['light', '밝게'], ['dark', '어둡게']].map(function (o) {

      (isInstalled() ? '' :
        '<div class="set-row"><h4>앱으로 설치</h4>' +
        '<p>홈 화면에 아이콘을 만들어 두면 다른 앱처럼 바로 열 수 있어요</p>' +
        '<button class="btn ghost small" id="btn-install" style="margin-top:10px">📱 홈 화면에 넣기</button></div>') +

  /* ============================================================
     레슨 진행
     ============================================================ */
  function startLesson(unit, n) {
    var L = unit ? G.buildLesson(unit, n) : G.buildReview();
    if (!L) { toast('복습할 것이 아직 없어요'); return; }
    S.lesson = L; S.queue = L.questions.slice(); S.qi = 0;
    S.correct = 0; S.first = 0; S.asked = 0; S.total = S.queue.length;
    S.t0 = Date.now();
    show('lesson');
    renderQ();
  }

  function lessonHead() {
    var total = S.total;                       // 틀려도 총 문항 수는 늘지 않습니다
    var pct = total ? (S.asked / total) * 100 : 0;
    return '<div class="lesson-bar">' +
      '<button class="x-btn" id="btn-quit" aria-label="나가기">✕</button>' +
      '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
      '<div style="font-weight:900;font-size:.7em;color:var(--ink-2);white-space:nowrap">' +
      S.asked + '/' + total + '</div></div>';
  }

  function picBox(key) {
    // 큰 물음표처럼 뜻이 없는 기호는 화면만 차지하므로 아예 넣지 않습니다
    if (!key || !G.hasPic(key) || G.isFillerPic(key)) return '';
    return '<div class="stage-pic">' + G.picHTML(key, 'pic-anim') + '</div>';
  }

  function renderQ() {
    var q = S.queue[0];
    if (!q) { finish(); return; }
    S.sel = null; S.placed = [];

    var h = lessonHead();
    h += '<div class="q-head">' + esc(q.head) + '</div>';
    // 아래에서 말풍선으로 다시 보여주는 유형(bank/type/repeat)은 여기서 또 쓰지 않습니다
    if (q.sub && (q.type === 'match' || (q.type === 'choice' && !q.sublarge))) {
      h += '<div class="q-sub">' + esc(q.sub) + '</div>';
    }

    if (q.type === 'pic') {
      h += '<div class="speak-row">' + speakerBtn(q.audio, true) +
        '<div class="bubble">' + esc(q.item.ko) + '</div>' + speakerBtn(q.audio) + '</div>';
      h += '<div class="choices grid2">';
      q.options.forEach(function (o, i) {
        h += '<button class="choice pic" data-i="' + i + '">' + G.picHTML(o.pic) +
          '<span style="font-size:.8em">' + esc(o.label) + '</span></button>';
      });
      h += '</div>';

    } else if (q.type === 'choice') {
      if (q.sublarge) {
        h += '<div class="speak-row">' + speakerBtn(q.audio || q.sub, true) +
          '<div class="bubble">' + esc(q.sub) + '</div>' + speakerBtn(q.audio || q.sub) + '</div>';
      } else if (q.pic) { h += picBox(q.pic); }
      h += '<div class="choices">';
      q.options.forEach(function (o, i) {
        h += '<button class="choice" data-i="' + i + '"><span class="num">' + (i + 1) + '</span>' +
          '<span>' + esc(o.label) + '</span></button>';
      });
      h += '</div>';

    } else if (q.type === 'bank') {
      if (q.listen) {
        h += '<div class="speak-row" style="justify-content:center">' + speakerBtn(q.item.en, true) + speakerBtn(q.item.en) + '</div>';
      } else {
        if (q.pic) h += picBox(q.pic);
        h += '<div class="speak-row"><div class="bubble" style="font-size:1.05em">' + esc(q.sub) + '</div></div>';
      }
      h += '<div class="answer-box" id="ansbox"></div>';
      h += '<div class="bank" id="bank">';
      q.bank.forEach(function (w, i) { h += '<button class="tile" data-w="' + i + '">' + esc(w) + '</button>'; });
      h += '</div>';
      h += '<div class="pad" style="margin-top:16px"><button class="btn ghost small" id="btn-dunno">잘 모르겠어요 (정답 보기)</button></div>';

    } else if (q.type === 'match') {
      h += '<div class="match-wrap" id="matchw">';
      for (var i = 0; i < q.left.length; i++) {
        h += '<button class="match-btn" data-side="L" data-id="' + q.left[i].id + '">' +
          '<span>' + esc(q.left[i].label) + '</span></button>' +
          '<button class="match-btn" data-side="R" data-id="' + q.right[i].id + '">' +
          '<span>' + esc(q.right[i].label) + '</span></button>';
      }
      h += '</div>';

    } else if (q.type === 'type') {
      if (q.pic) h += picBox(q.pic);
      h += '<div class="speak-row"><div class="bubble" style="font-size:1.05em">' + esc(q.sub) + '</div></div>';
      h += '<input class="typebox" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 적어 보세요">';
      h += '<div class="pad" style="margin-top:16px"><button class="btn ghost small" id="btn-dunno">잘 모르겠어요 (정답 보기)</button></div>';

    } else if (q.type === 'repeat') {
      h += picBox(q.pic);
      h += '<div class="speak-row">' + speakerBtn(q.sub, true) +
        '<div class="bubble">' + esc(q.sub) + '<div class="ko">' + esc(q.ko) + '</div></div>' +
        speakerBtn(q.sub) + '</div>';
      h += '<p class="q-sub">소리를 듣고 큰 소리로 두 번 따라 읽어 보세요. 다 하셨으면 아래를 눌러 주세요.</p>';
    }

    h += '<div class="footer-cta" id="cta"></div>';
    el('scr-lesson').innerHTML = h;

    // 하단 버튼
    var cta = el('cta');
    if (q.type === 'repeat') {
      cta.innerHTML = '<button class="btn" id="btn-next">따라 읽었어요 👍</button>';
    } else if (q.type === 'match') {
      cta.innerHTML = '<button class="btn" id="btn-check" disabled>모두 맞추면 넘어가요</button>';
    } else {
      cta.innerHTML = '<button class="btn" id="btn-check" disabled>확인</button>';
    }

    if (q.type === 'bank') renderBank();
    if (q.type === 'match') { mLeft = q.left.length; mSel = null; }

    // 자동 읽어주기
    if (P.settings.autoPlay && G.voiceOK()) {
      var t = q.type === 'bank' && q.listen ? q.item.en
        : q.type === 'pic' ? q.audio
          : (q.sublarge ? (q.audio || q.sub) : (q.type === 'repeat' ? q.sub : null));
      if (t) setTimeout(function () { G.speak(t); }, 260);
    }
    if (q.type === 'type') setTimeout(function () { var i = el('typein'); if (i) i.focus(); }, 120);
  }

  function renderBank() {
    var q = S.queue[0], box = el('ansbox'), bank = el('bank');
    if (!box) return;
    box.innerHTML = S.placed.map(function (bi, k) {
      return '<button class="tile placed" data-rm="' + k + '">' + esc(q.bank[bi]) + '</button>';
    }).join('');
    Array.prototype.forEach.call(bank.children, function (b, i) {
      b.classList.toggle('used', S.placed.indexOf(i) >= 0);
    });
    var btn = el('btn-check');
    if (btn) btn.disabled = S.placed.length === 0;
  }

  /* ---- 판정 ----
     맞출 때까지 같은 문제를 다시 풉니다. 두 번째 시도부터는 정답을 보여드려서
     막혀서 그만두시는 일이 없게 합니다. */
  function verdict(ok, answerText, note) {
    var q = S.queue[0];
    if (q.item) G.recordAnswer(q.item.id, ok);
    q._tries = (q._tries || 0) + 1;
    if (ok) {
      S.asked++; S.correct++;
      if (q._tries === 1) S.first++;
    }

    var v = document.createElement('div');
    v.className = 'verdict ' + (ok ? 'good' : 'bad');
    v.innerHTML = '<h4>' + (ok
      ? '<span style="font-size:1.3em">🎉</span> 정답입니다!'
      : '<span style="font-size:1.3em">💪</span> 다시 해볼까요?') + '</h4>' +
      (answerText ? '<p class="ans">' + answerText + '</p>' : '') +
      (note ? '<p class="ans"><em>' + note + '</em></p>' : '') +
      '<button class="btn' + (ok ? '' : ' rose') + '" id="' + (ok ? 'btn-next' : 'btn-retry') + '">' +
      (ok ? '계속하기' : '다시 해보기') + '</button>';
    document.body.appendChild(v);
    requestAnimationFrame(function () { v.classList.add('on'); });
    S.verdictEl = v;

    var cta = el('cta'); if (cta) cta.style.display = 'none';
    var en = q.item ? q.item.en : null;
    if (ok) G.praise(en); else G.encourage(en);
  }

  function clearVerdict() {
    if (S.verdictEl) { S.verdictEl.remove(); S.verdictEl = null; }
  }

  /* 틀린 문제를 같은 화면에서 다시 풀게 준비 — 이미 고른 오답은 지워진 채로 남습니다 */
  function retry() {
    clearVerdict();
    var q = S.queue[0];
    var cta = el('cta'); if (cta) cta.style.display = '';
    S.sel = null;

    if (q.type === 'choice' || q.type === 'pic') {
      document.querySelectorAll('.choice').forEach(function (c) { c.classList.remove('sel'); });
    } else if (q.type === 'bank') {
      S.placed = [];
      var box = el('ansbox');
      if (box) box.classList.remove('right', 'wrong');
      renderBank();
    } else if (q.type === 'type') {
      var i = el('typein');
      if (i) { i.value = ''; i.focus(); }
    }
    var cb = el('btn-check');
    if (cb) cb.disabled = true;
  }

  function nextQ() {
    clearVerdict();
    var q = S.queue.shift();
    if (q && q.type === 'repeat') S.asked++;              // 따라 읽기도 진도에 포함
    if (!S.queue.length) finish(); else renderQ();
  }

  function check() {
    var q = S.queue[0];
    // 첫 시도에는 정답을 알려주지 않습니다 (스스로 다시 풀 기회를 드리려고).
    // 두 번 이상 틀리면 정답을 보여드립니다.
    var reveal = (q._tries || 0) >= 1;

    if (q.type === 'pic' || q.type === 'choice') {
      if (S.sel === null) return;
      var ok = q.options[S.sel].ok;
      var nodes = document.querySelectorAll('.choice');
      if (ok) {
        q.options.forEach(function (o, i) {
          if (o.ok) nodes[i].classList.add('right');
          nodes[i].disabled = true;
        });
      } else {
        nodes[S.sel].classList.add('wrong');
        nodes[S.sel].disabled = true;                       // 틀린 것은 지워 둡니다
        if (reveal) {
          q.options.forEach(function (o, i) { if (o.ok) nodes[i].classList.add('right'); });
        }
      }
      var right = q.options.filter(function (o) { return o.ok; })[0].label;
      verdict(ok,
        ok ? '' : (reveal ? '정답: <b>' + esc(right) + '</b>' : '아니에요. 다른 것을 골라 보세요.'),
        (!ok && reveal && q.item && q.item.kind === 's') ? esc(q.item.en) + ' — ' + esc(q.item.ko) : '');

    } else if (q.type === 'bank') {
      var got = S.placed.map(function (i) { return q.bank[i]; }).join(' ');
      var ok2 = G.normalize(got) === G.normalize(q.answer.join(' '));
      var box = el('ansbox'); box.classList.add(ok2 ? 'right' : 'wrong');
      verdict(ok2,
        ok2 ? esc(q.item.ko) : (reveal ? '정답: <b>' + esc(q.answer.join(' ')) + '</b>' : '순서를 다시 맞춰 보세요.'),
        ok2 ? '' : esc(q.item.ko));

    } else if (q.type === 'type') {
      var v = (el('typein') || {}).value || '';
      var ok3 = G.normalize(v) === G.normalize(q.answer);
      verdict(ok3,
        ok3 ? '' : (reveal ? '정답: <b>' + esc(q.answer) + '</b>' : '철자를 다시 확인해 보세요.'),
        esc(q.item.ko));
    }
  }

  function finish() {
    var secs = (Date.now() - S.t0) / 1000;
    G.addMinutes(secs);
    var L = S.lesson;
    var xp = 10 + S.first;
    if (L.unit) {
      var cur = G.P().prog[L.unit.id] || 0;
      if (L.n === cur) G.P().prog[L.unit.id] = cur + 1;
      else if (L.n >= cur) G.P().prog[L.unit.id] = L.n + 1;
    }
    G.markStudied(xp);
    P = G.P();

    var acc = S.asked ? Math.round(S.first / Math.max(1, S.total) * 100) : 0;
    var mins = Math.round(secs / 60 * 10) / 10;
    var goalHit = G.goalPct() >= 1;

    var h = '<div class="done-wrap">' +
      '<div class="mascot">' + G.MASCOT.cheer + '</div>' +
      '<h2>' + (acc >= 90 ? '완벽해요!' : acc >= 70 ? '아주 잘하셨어요!' : '끝까지 하셨어요!') + '</h2>' +
      '<p style="color:var(--ink-2);font-weight:700;font-size:.88em;margin:0">' + esc(L.title) + '</p>' +
      '<div class="stat-row">' +
      '<div class="stat"><b>+' + xp + '</b><span>별점</span></div>' +
      '<div class="stat g"><b>' + acc + '%</b><span>정답률</span></div>' +
      '<div class="stat b"><b>' + mins + '분</b><span>걸린 시간</span></div></div>';

    if (goalHit) {
      h += '<div class="card" style="border-color:var(--gold);background:var(--gold-soft)">' +
        '<h3 style="margin:0">🎯 오늘 목표 ' + P.settings.goal + '분 달성!</h3>' +
        '<p style="margin:6px 0 0;font-size:.85em;font-weight:700">🔥 ' + G.liveStreak() + '일 연속이에요. 내일도 만나요!</p></div>';
    } else {
      var left = Math.max(0, P.settings.goal - G.today().min);
      h += '<div class="card"><h3 style="margin:0">오늘 ' + Math.round(left) + '분 남았어요</h3>' +
        '<p style="margin:6px 0 0;font-size:.85em;font-weight:700;color:var(--ink-2)">한 단계만 더 하면 오늘 목표 끝!</p></div>';
    }

    h += '<div style="height:8px"></div>' +
      '<button class="btn" id="btn-again">▶︎ 한 단계 더 하기</button>' +
      '<div style="height:12px"></div>' +
      '<button class="btn ghost" id="btn-home">오늘은 여기까지</button></div>';

    el('scr-done').innerHTML = h;
    show('done');
    if (acc >= 70 || goalHit) confetti();
    G.sfx('finish');
    setTimeout(function () { G.speak(acc >= 90 ? 'Perfect! Well done.' : 'Good job!'); }, 900);
  }

  /* ---------------- 온보딩 ---------------- */
  function renderOnboard() {
    var h = '<div class="ob"><div class="mascot">' + G.MASCOT.happy + '</div>' +
      '<h1>엄마의 영어</h1>' +
      '<p>하루 20분, 그림과 소리로 배우는 영어<br>가장 쉬운 인사부터 시작합니다</p>' +
      '<div class="card" style="text-align:left">' +
      '<h4 style="margin:0 0 8px">먼저 글씨 크기를 골라 주세요</h4>' +
      '<div class="seg" id="ob-size">' +
      [['normal', '보통'], ['large', '크게'], ['xlarge', '아주 크게']].map(function (o) {
        return '<button data-v="' + o[0] + '" class="' + (P.settings.size === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
      }).join('') + '</div>' +
      '<h4 style="margin:22px 0 8px">이름을 알려 주세요 (선택)</h4>' +
      '<input class="typebox" id="ob-name" style="width:100%;margin:0" placeholder="예: 영자">' +
      '<h4 style="margin:22px 0 8px">소리가 잘 들리나요?</h4>' +
      '<button class="btn ghost small" data-speak="Hello! Nice to meet you.">🔊 눌러서 확인하기</button>' +
      '<p class="q-sub" style="padding:0;margin:10px 0 0">소리가 안 나도 괜찮아요. 그림과 글씨로 배울 수 있어요.</p>' +
      '</div>' +
      '<button class="btn" id="ob-start">시작하기</button><div style="height:40px"></div></div>';
    el('scr-onboard').innerHTML = h;
    show('onboard');
  }

  /* ============================================================
     이벤트 (한 곳에서 위임 처리)
     ============================================================ */
  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest('[data-speak]');
    if (t) {
      // 영어 음성이 없을 때는, 직접 스피커를 누르셨을 때만 안내합니다.
      // (문제가 넘어갈 때마다 안내창이 뜨면 학습이 계속 끊깁니다)
      if (!G.voiceOK()) {
        if (!voiceHelpSeen) { voiceHelpSeen = true; voiceHelp(); }
        else toast('이 기기에 영어 음성이 없어요 · 설정 → 소리가 안 나올 때');
        return;
      }
      G.speak(t.getAttribute('data-speak'), t.hasAttribute('data-slow')); flashSpk(t); return;
    }

    var b = e.target.closest('button');
    if (!b) {
      if (e.target.classList && e.target.classList.contains('modal-bg')) closeModal();
      return;
    }
    var id = b.id;

    if (b.hasAttribute('data-close-modal')) { closeModal(); return; }
    if (id === 'btn-voicehelp') { voiceHelp(); return; }
    if (id === 'btn-install') { doInstall(); return; }

    /* --- 탭 --- */
    var tab = b.closest('.tab');
    if (tab) {
      var to = tab.getAttribute('data-tab');
      S.tab = to;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === tab); });
      if (to === 'learn') { renderHome(); show('home'); }
      if (to === 'review') { renderReview(); show('review'); }
      if (to === 'stats') { renderStats(); show('stats'); }
      if (to === 'settings') { renderSettings(); show('settings'); }
      return;
    }

    /* --- 홈 --- */
    if (id === 'btn-continue') { var nx = G.nextLesson(); if (nx) startLesson(nx.unit, nx.n); return; }
    if (id === 'btn-review-now' || id === 'btn-review2' || id === 'btn-review3') { startLesson(null); return; }
    if (id === 'btn-goto-learn') { document.querySelector('.tab[data-tab="learn"]').click(); return; }

    var node = b.closest('.node');
    if (node && !node.disabled) {
      var u = G.UNITS.filter(function (x) { return x.id === node.getAttribute('data-unit'); })[0];
      startLesson(u, parseInt(node.getAttribute('data-n'), 10));
      return;
    }

    /* --- 레슨 --- */
    if (id === 'btn-quit') {
      G.addMinutes((Date.now() - S.t0) / 1000);
      G.stopSpeak(); clearVerdict();
      renderHome(); show('home'); toast('여기까지 한 것은 저장했어요');
      return;
    }
    if (id === 'btn-check') { check(); return; }
    if (id === 'btn-next') { G.stopSpeak(); nextQ(); return; }
    if (id === 'btn-retry') { G.stopSpeak(); retry(); return; }
    if (id === 'btn-dunno') {
      var q = S.queue[0];
      if (q.type === 'bank') {
        S.placed = [];
        var used = {};
        q.answer.forEach(function (w) {
          for (var i = 0; i < q.bank.length; i++) if (!used[i] && q.bank[i] === w) { used[i] = 1; S.placed.push(i); break; }
        });
        renderBank();
      } else if (q.type === 'type') {
        var inp = el('typein'); if (inp) inp.value = q.answer;
      }
      G.speak(q.item.en, true);
      toast('정답을 보여드렸어요. 소리 내어 읽어 보세요');
      var cb = el('btn-check'); if (cb) cb.disabled = false;
      return;
    }
    if (id === 'btn-again') {
      var nx2 = G.nextLesson();
      if (nx2) startLesson(nx2.unit, nx2.n); else startLesson(null);
      return;
    }
    if (id === 'btn-home') { renderHome(); show('home'); return; }

    /* --- 선택지 --- */
    var ch = b.closest('.choice');
    if (ch && !ch.disabled) {
      document.querySelectorAll('.choice').forEach(function (x) { x.classList.remove('sel'); });
      ch.classList.add('sel');
      S.sel = parseInt(ch.getAttribute('data-i'), 10);
      var q2 = S.queue[0];
      if (q2 && q2.type === 'pic') G.speak(q2.options[S.sel].label);
      var cb2 = el('btn-check'); if (cb2) cb2.disabled = false;
      return;
    }

    /* --- 단어 조립 --- */
    var tile = b.closest('.tile');
    if (tile) {
      if (tile.hasAttribute('data-rm')) {
        S.placed.splice(parseInt(tile.getAttribute('data-rm'), 10), 1);
      } else {
        var i2 = parseInt(tile.getAttribute('data-w'), 10);
        if (S.placed.indexOf(i2) < 0) { S.placed.push(i2); G.speak(S.queue[0].bank[i2]); }
      }
      renderBank();
      return;
    }

    /* --- 짝 맞추기 --- */
    var mb = b.closest('.match-btn');
    if (mb) { matchTap(mb); return; }

    /* --- 설정 --- */
    var seg = b.closest('.seg');
    if (seg) {
      var v = b.getAttribute('data-v');
      seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      if (seg.id === 'seg-size' || seg.id === 'ob-size') P.settings.size = v;
      if (seg.id === 'seg-rate') P.settings.rate = parseFloat(v);
      if (seg.id === 'seg-goal') P.settings.goal = parseInt(v, 10);
      if (seg.id === 'seg-theme') P.settings.theme = v;
      if (seg.id === 'seg-auto') P.settings.autoPlay = v === '1';
      if (seg.id === 'seg-sfx') P.settings.sfx = v === '1';
      G.save(); applySettings();
      if (seg.id === 'seg-rate') G.speak('Good morning. How are you today?');
      if (seg.id === 'seg-sfx' && v === '1') G.sfx('good');
      return;
    }

    // 목소리 고르기 — 누르면 바로 그 목소리로 들려드립니다
    var vrow = b.closest('[data-voice]');
    if (vrow) {
      var vname = vrow.getAttribute('data-voice');
      G.setVoice(vname);
      document.querySelectorAll('[data-voice]').forEach(function (x) {
        x.classList.toggle('on', x === vrow);
      });
      G.speak('Hello. Nice to meet you. How are you today?');
      return;
    }
    if (id === 'btn-reset') {
      if (confirm('정말 처음부터 다시 시작할까요?\n지금까지의 진도와 기록이 모두 사라집니다.')) {
        G.reset(); P = G.P(); applySettings(); renderHome(); show('home'); toast('처음으로 되돌렸어요');
      }
      return;
    }
    if (id === 'ob-start') {
      var n = el('ob-name'); P.name = n ? n.value.trim() : '';
      P.onboarded = true; G.save(); applySettings();
      renderHome(); show('home');
      return;
    }
  });

  function flashSpk(t) {
    if (!t.classList.contains('spk')) return;
    t.classList.add('playing');
    setTimeout(function () { t.classList.remove('playing'); }, 1400);
  }

  /* 짝 맞추기 로직 */
  var mSel = null, mLeft = 0;
  function matchTap(btn) {
    var q = S.queue[0];
    if (!mSel) {
      if (btn.classList.contains('sel')) { btn.classList.remove('sel'); mSel = null; return; }
      document.querySelectorAll('.match-btn').forEach(function (x) { x.classList.remove('sel'); });
      btn.classList.add('sel'); mSel = btn;
      if (btn.getAttribute('data-side') === 'L') G.speak(btn.textContent.trim());
      return;
    }
    if (btn === mSel) { btn.classList.remove('sel'); mSel = null; return; }
    if (btn.getAttribute('data-side') === mSel.getAttribute('data-side')) {
      mSel.classList.remove('sel'); btn.classList.add('sel'); mSel = btn; return;
    }
    var same = btn.getAttribute('data-id') === mSel.getAttribute('data-id');
    if (same) {
      var it = G.ITEMS[btn.getAttribute('data-id')];
      if (it) G.recordAnswer(it.id, true);
      btn.classList.add('gone'); mSel.classList.add('gone'); mSel.classList.remove('sel');
      G.speak(it ? it.en : '');
      mSel = null; mLeft--;
      if (mLeft <= 0) {
        S.asked++; S.correct++; S.first++;
        var cb = el('btn-check');
        if (cb) { cb.disabled = false; cb.id = 'btn-next'; cb.textContent = '잘하셨어요! 계속하기 👍'; }
      }
    } else {
      var a = btn, c = mSel;
      a.classList.add('bad'); c.classList.add('bad'); c.classList.remove('sel'); mSel = null;
      var mid = btn.getAttribute('data-id');
      if (G.ITEMS[mid]) G.recordAnswer(mid, false);
      setTimeout(function () { a.classList.remove('bad'); c.classList.remove('bad'); }, 420);
    }
  }

  /* 엔터로 확인 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (S.screen !== 'lesson') return;
    var n = el('btn-next') || el('btn-retry') || el('btn-check');
    if (n && !n.disabled) { e.preventDefault(); n.click(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'typein') {
      var cb = el('btn-check'); if (cb) cb.disabled = !e.target.value.trim();
    }
    if (e.target.id === 'set-name') { P.name = e.target.value.trim(); G.save(); }
  });

  /* 페이지를 벗어날 때 시간 저장 */
  window.addEventListener('pagehide', function () {
    if (S.screen === 'lesson' && S.t0) G.addMinutes((Date.now() - S.t0) / 1000);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { G.stopSpeak(); if (S.screen === 'lesson' && S.t0) { G.addMinutes((Date.now() - S.t0) / 1000); S.t0 = Date.now(); } }
  });

  /* ---------------- 시작 ---------------- */
  G.boot = function () {
    applySettings();
    G.initVoice(function () {
      // 음성 목록은 늦게 도착할 수 있어서, 확인되면 홈을 한 번 다시 그립니다.
      if (S.screen === 'home') renderHome();
    });
    if (!P.onboarded) renderOnboard();
    else { renderHome(); show('home'); }
  };

})(window.G = window.G || {});

window.addEventListener('DOMContentLoaded', function(){ G.boot(); });
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
